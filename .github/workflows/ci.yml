name: CI

# No push trigger: main's ruleset requires a branch to be up to date before
# merging, so a run here tests the tree its squash will land. warm-cache.yml is
# what main runs.

on:
  pull_request:
  workflow_dispatch:

# A superseded run tests a tree nothing will merge. Cancelling costs nothing
# here: these jobs export no cache, so a cancelled one leaves nothing behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/knight-owl-dev/keystone-hook-diagrams

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `container:` — the Makefile re-enters the pinned ci-tools image
      # itself. GITHUB_TOKEN reaches validate-action-pins through LINT_RUNNER.
      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint

  bats:
    name: BATS
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run BATS tests
        run: make test-bats

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    # Native runner per architecture: the published image is multi-arch, and
    # Chromium against musl is where an arch difference shows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `make build` goes through compose, which declares both platforms and so
      # cannot --load on a stock runner.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Constrains the build to the arch the matrix names. Redundant on a
          # native runner; without it, an arch paired with the wrong runner
          # label builds that runner's platform and reports its leg green over
          # an image the matrix never covered.
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: keystone-hook-diagrams:ci
          # Versioned so `describe` sends a cache identity. An unversioned
          # image sends none, and probe.js then skips the identity assertions,
          # leaving publish as their first gate — where a failure is a failed
          # release.
          build-args: IMAGE_VERSION=v0.0.0-ci
          # warm-cache.yml writes this ref from main with mode=max, so a PR
          # restores the deps stage and the chromium layer. :latest holds no
          # cache manifest.
          #
          # No export here: a fork's pull request gets no packages: write, so
          # it would fail on the runs that most need the cache.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}

      - name: Test the image
        run: make test-image IMAGE_TAG=keystone-hook-diagrams:ci

  # main's ruleset requires this context by name and is not in version control.
  # Routing the requirement through a gate is what lets an architecture be
  # added, removed or renamed without an out-of-band ruleset edit.
  image-gate:
    name: Image
    needs: image
    # Without always(), a failed leg skips this job — and a skipped required
    # check counts as passing.
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Assert every architecture passed
        env:
          # A matrix job's result is the aggregate over its legs.
          RESULT: ${{ needs.image.result }}
        run: |
          if [[ "${RESULT}" != "success" ]]; then
            echo "ERROR: image suite ${RESULT}" >&2
            exit 1
          fi
