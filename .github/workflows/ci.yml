name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `container:` — the Makefile re-enters the pinned ci-tools image
      # itself. GITHUB_TOKEN reaches validate-action-pins through LINT_RUNNER.
      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint

  bats:
    name: BATS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run BATS tests
        run: make test-bats

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    # Native runner per architecture: the published image is multi-arch, and
    # Chromium against musl is where an arch difference shows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `make build` goes through compose, which declares both platforms and so
      # cannot --load on a stock runner. This builds the runner's own platform.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: keystone-hook-diagrams:ci
          # Versioned so `describe` sends a cache identity. An unversioned
          # image sends none, and probe.js then skips the identity assertions,
          # leaving publish as their first gate — where a failure is a failed
          # release.
          build-args: IMAGE_VERSION=v0.0.0-ci
          cache-from: type=registry,ref=ghcr.io/knight-owl-dev/keystone-hook-diagrams:latest

      - name: Test the image
        run: make test-image IMAGE_TAG=keystone-hook-diagrams:ci
