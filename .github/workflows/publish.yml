name: Publish Image

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # cosign keyless signing (Fulcio OIDC)
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        # Strict vN.N.N only. The tag is the release version.
        run: ./scripts/validate-version-strict.sh "${{ github.ref_name }}"

      - name: Assert the tag matches the stamped version
        # The release PR stamps `version`; the tag is promoted from its branch
        # name. A mismatch would publish an image whose IMAGE_VERSION disagrees
        # with its own file.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          stamped="$(make get-version)"
          if [[ "v${stamped}" != "${TAG}" ]]; then
            echo "ERROR: tag ${TAG} but version file says ${stamped}" >&2
            exit 1
          fi
          echo "OK: ${TAG} matches the stamped version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build for test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: keystone-hook-diagrams:verify
          build-args: IMAGE_VERSION=${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/knight-owl-dev/keystone-hook-diagrams:latest

      - name: Test the image
        # The publish gate, run against the versioned build so the cache
        # identity the release stamps is checked too.
        run: make test-image IMAGE_TAG=keystone-hook-diagrams:verify

      - name: Assert scan policy is present
        # trivy-config fails open: a trivy.yaml Trivy cannot read scans with
        # defaults and exits 0, un-gating publish. Rationale in cve-monitor.yml.
        run: |
          if [[ ! -r trivy.yaml ]]; then
            echo "ERROR: trivy.yaml unreadable — the scan would pass without enforcing policy" >&2
            exit 1
          fi

      - name: Scan for vulnerabilities
        # Scans the single-platform image built above (amd64 on GitHub-hosted
        # runners). arm64 is not scanned separately — CVEs are tracked by source
        # package, so the amd64 scan covers the same package set for both.
        #
        # Policy comes from trivy.yaml. Do not add severity/exit-code/
        # ignore-unfixed inputs here — the action turns any input it receives
        # into a TRIVY_* env var, which overrides the config file.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: keystone-hook-diagrams:verify
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          # Keep in sync with the Makefile and cve-monitor.yml (see trivy.yaml).
          version: v0.74.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: IMAGE_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/knight-owl-dev/keystone-hook-diagrams:latest
            ghcr.io/knight-owl-dev/keystone-hook-diagrams:${{ github.ref_name }}
          push: true
          sbom: true
          provenance: true
          annotations: |
            index:org.opencontainers.image.description=Mermaid diagram rendering hook for Keystone
            index:org.opencontainers.image.source=https://github.com/knight-owl-dev/keystone-hook-diagrams
            index:org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=ghcr.io/knight-owl-dev/keystone-hook-diagrams:latest
          cache-to: type=inline

      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # Signs the manifest index — one signature covers both platforms and tags.
        # The identity this issues under is the workflow's own path, which is what
        # a consumer's --certificate-identity-regexp has to match.
        run: cosign sign --yes "ghcr.io/knight-owl-dev/keystone-hook-diagrams@${DIGEST}"

  release:
    name: Create Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Changelog only: this repo ships an image, not release assets. The
        # Release exists so the tag anchors a changelog entry (categories in
        # .github/release.yml).
        run: gh release create "${TAG}" --generate-notes
