name: Publish Image

on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE: ghcr.io/knight-owl-dev/keystone-hook-diagrams

# Serialize publishes. Two releases in flight would race to name :latest, and
# the loser's tag would resolve to the other's image. Never cancel one midway:
# a half-pushed release leaves per-arch manifests with no index naming them.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    # One native runner per architecture, and each pushes its own manifest by
    # digest; the merge job below assembles the list. Building both platforms on
    # one runner puts the arm64 leg under QEMU, where `npm ci` dies on an
    # illegal instruction — Node's own code, emulated.
    strategy:
      # A scan that stops the release reports every architecture's findings at
      # once; fixing them one at a time burns a version per finding. Cancelling
      # a sibling also risks the mid-push cut the concurrency block above
      # refuses.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        # Strict vN.N.N only. The tag is the release version.
        run: ./scripts/validate-version-strict.sh "${{ github.ref_name }}"

      - name: Assert the tag matches the stamped version
        # The release PR stamps `version`; the tag is promoted from its branch
        # name. A mismatch would publish an image whose IMAGE_VERSION disagrees
        # with its own file.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          stamped="$(make get-version)"
          if [[ "v${stamped}" != "${TAG}" ]]; then
            echo "ERROR: tag ${TAG} but version file says ${stamped}" >&2
            exit 1
          fi
          echo "OK: ${TAG} matches the stamped version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The build below reads its cache from GHCR, so login precedes it.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Constrains the build to the arch the matrix names. Redundant on a
          # native runner; without it, an arch paired with the wrong runner
          # label builds that runner's platform and the index carries one
          # architecture twice.
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: keystone-hook-diagrams:verify
          build-args: IMAGE_VERSION=${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}

      - name: Test the image
        # The publish gate, run against the versioned build so the cache
        # identity the release stamps is checked too. Native runners mean this
        # now covers both architectures rather than amd64 alone.
        run: make test-image IMAGE_TAG=keystone-hook-diagrams:verify

      - name: Assert scan policy is present
        # trivy-config fails open: a trivy.yaml Trivy cannot read scans with
        # defaults and exits 0, un-gating publish. Rationale in cve-monitor.yml.
        run: |
          if [[ ! -r trivy.yaml ]]; then
            echo "ERROR: trivy.yaml unreadable — the scan would pass without enforcing policy" >&2
            exit 1
          fi

      - name: Scan for vulnerabilities
        # Policy comes from trivy.yaml. Do not add severity/exit-code/
        # ignore-unfixed inputs here — the action turns any input it receives
        # into a TRIVY_* env var, which overrides the config file.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: keystone-hook-diagrams:verify
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          # Keep in sync with the Makefile and cve-monitor.yml (see trivy.yaml).
          version: v0.74.0

      # No tag: this pushes the manifest under its digest only, so neither arch
      # claims :latest on its own. The merge job names them.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: IMAGE_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          # Exported after the scan, which keeps a failed release from adding
          # to these refs. It does not keep unscanned layers off the package:
          # warm-cache.yml writes the same refs from main, and a release ships
          # main's tree. Costs no rebuild — the builder outlives the step, so
          # this build hits local cache.
          #
          # A registry ref and not type=gha: this workflow runs on tag pushes,
          # an Actions cache is readable only from the ref that wrote it and
          # from the default branch, and each release is its own tag — so
          # nothing written here would ever be read back. One ref per arch; the
          # two hold different layers. ci.yml reads the same refs.
          #
          # mode=max caches every stage, not only what reaches the final image.
          # The deps stage exists to produce /app/node_modules and is COPY
          # --from'd out, so a final-image cache never records its `npm ci`.
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # The filename is the digest; the file itself is empty. The merge job
        # only needs the names.
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and sign
    needs: build
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      id-token: write # cosign keyless signing (Fulcio OIDC)
      packages: write

    steps:
      # Scoped to this run, so only the uploads above can match. The pattern
      # succeeds on a short set, so the merge step's count is what gates a
      # missing architecture.
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The per-arch manifests carry their own labels; annotations belong on the
      # index, which is what a registry UI and a consumer read first.
      - name: Create the manifest list
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Globbed by absolute path. working-directory resolves before the
          # script runs, so a merge-only re-run after the digests expire fails
          # there rather than reaching the guard below.
          #
          # nullglob keeps a missing or empty directory at zero refs, rather
          # than one ref to the literal '*'.
          shopt -s nullglob
          refs=()
          for path in /tmp/digests/*; do
            refs+=("${IMAGE}@sha256:${path##*/}")
          done
          # One digest per architecture in the build matrix. A short set merges
          # an index missing an architecture and moves the release tag onto it.
          # Raise this number when an architecture is added — forgetting fails
          # the release.
          if [[ ${#refs[@]} -ne 2 ]]; then
            echo "ERROR: expected 2 digests, got ${#refs[@]} — refusing to merge" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=Mermaid diagram rendering hook for Keystone" \
            --annotation "index:org.opencontainers.image.source=https://github.com/knight-owl-dev/keystone-hook-diagrams" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${TAG}" \
            "${refs[@]}"

      - name: Read the index digest
        id: index
        env:
          TAG: ${{ github.ref_name }}
        # Signing the index is what makes one signature cover both platforms and
        # both tags, so the digest has to come back from the registry rather
        # than from either per-arch push.
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "index ${digest}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        # The identity this issues under is the workflow's own path, which is
        # what a consumer's --certificate-identity-regexp has to match.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: Create Release
    needs: merge
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Changelog only: this repo ships an image, not release assets. The
        # Release exists so the tag anchors a changelog entry (categories in
        # .github/release.yml).
        run: gh release create "${TAG}" --generate-notes
