# Suppressed CVEs for the keystone-hook-diagrams image.
#
# Suppress only when no fix has reached the image AND the vulnerability is not
# reachable here. Each entry carries a `statement` (justification) and an
# `expired_at` date. When the date passes the entry stops suppressing and the
# CVE reappears in the scan, forcing a re-triage: bump the offending tool if a
# patched upstream release shipped, or extend the date with a fresh
# justification.
#
# Suppressions only — the rest of the scan policy is shared across images in
# the repo-root trivy.yaml. Trivy does NOT auto-detect this file: every
# invocation names it explicitly (Makefile `--ignorefile`, the trivy-action
# `trivyignores:` input), so a missing file fails the scan.
#
# Write `statement` as a block scalar (`>-`), as below: a plain scalar ends at
# the first " #", so YAML drops the "#NN" pointer without an error.
#
# Suppression entry example:
#
#  - id: CVE-YYYY-NNNNN
#    statement: >-
#      <package>: <short description>, fixed in <version>. Affects <tool>
#      <version> — <why the practical risk is negligible here>. Tracking:
#      #NN. Remove once <tool> ships a build on <fixed version>.
#    expired_at: 2026-07-21  # ~45 days out, matching the dependency's cadence
#
vulnerabilities:
  - id: CVE-2026-4800
    statement: >-
      lodash-es: _.template imports code execution, fixed in 4.18.0. mermaid
      12.0.0 pins chevrotain ~11.1.2, which pins lodash-es 4.17.23. Never
      loaded: Node requires only puppeteer-core, and mermaid's browser bundle
      carries no _.template. Tracking: #45. Remove once mermaid ships on
      chevrotain >= 12.
    expired_at: 2026-11-07
